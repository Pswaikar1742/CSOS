<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Gradient background circle -->
  <defs>
    <linearGradient id="smartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066cc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#003d99;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <circle cx="100" cy="100" r="95" fill="url(#smartGrad)" stroke="#002147" stroke-width="2"/>
  
  <!-- Smart City theme: network/tech icon -->
  <!-- Center building symbol -->
  <rect x="75" y="60" width="50" height="50" fill="none" stroke="white" stroke-width="2"/>
  <line x1="100" y1="60" x2="100" y2="110" stroke="white" stroke-width="2"/>
  <line x1="75" y1="85" x2="125" y2="85" stroke="white" stroke-width="2"/>
  
  <!-- Corner connectors (network theme) -->
  <circle cx="70" cy="55" r="4" fill="#00d9ff"/>
  <circle cx="130" cy="55" r="4" fill="#00d9ff"/>
  <circle cx="70" cy="115" r="4" fill="#00d9ff"/>
  <circle cx="130" cy="115" r="4" fill="#00d9ff"/>
  
  <!-- Connecting lines -->
  <line x1="74" y1="55" x2="96" y2="70" stroke="#00d9ff" stroke-width="1.5" opacity="0.6"/>
  <line x1="126" y1="55" x2="104" y2="70" stroke="#00d9ff" stroke-width="1.5" opacity="0.6"/>
  <line x1="74" y1="115" x2="96" y2="100" stroke="#00d9ff" stroke-width="1.5" opacity="0.6"/>
  <line x1="126" y1="115" x2="104" y2="100" stroke="#00d9ff" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Smart City text -->
  <text x="100" y="155" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#00d9ff">SMART</text>
  <text x="100" y="172" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white" opacity="0.9">CITY MISSION</text>
</svg>